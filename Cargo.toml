[package]
name = "ftg"
version = "0.1.0"
edition = "2024"
description = "ftg"
readme = "README.md"
repository = "https://github.com/mkxl/ftg.git"
license = "Apache-2.0"
keywords = ["text-editor"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.100"
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.5.56", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream", "libc", "serde", "use-dev-tty"] }
derive_more = { version = "2.1.1", features = ["constructor"] }
futures = "0.3.31"
mkutils = { version = "0.1.44", features = ["async", "fs", "mkutils-macros", "misc", "output", "process", "ropey", "serde", "socket", "tracing", "tui"] }
nodit = "0.10.0"
palette = { version = "0.7.6", features = ["serde"] }
ratatui = { version = "0.30.0", features = ["serde"] }
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "valuable"] }
ulid = { version = "1.2.1", features = ["serde"] }

[workspace.lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
cargo = "deny"
nursery = "deny"
pedantic = "deny"
future_not_send = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
struct_field_names = { level = "allow", priority = 1 }
unit_arg = { level = "allow", priority = 1 }

[patch.crates-io]
crossterm = { git = 'https://github.com/crossterm-rs/crossterm', rev = "4f08595" }

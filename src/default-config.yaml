color_scheme:
  main:
    fg: "#B7B9BC"
    bg: "#1A1D23"
  status_bar:
    fg: "#2A2A2A"
    bg: "#505050"
  tabs:
    active:
      tab:
        fg: "#D7DAE0"
        bg: "#2B303A"
      filepath:
        fg: "#858B96"
        bg: "#2B303A"
    inactive:
      tab:
        fg: "#B7B9BC"
        bg: "#22262E"
      filepath:
        fg: "#666A73"
        bg: "#22262E"

theme:
  gutter_lighten: 0.25
  gutter_padding: 3
  tabs_width_percentage: 25

key_map:
  - keys: [ctrl+q]
    binding:
      command: quit
  - keys: [left]
    binding:
      command: move_backward
  - keys: [right]
    binding:
      command: move_forward
  - keys: [up]
    binding:
      command: move_up
  - keys: [down]
    binding:
      command: move_down
  - keys: [alt+j]
    binding:
      command: scroll_left
      args: 5
  - keys: [alt+l]
    binding:
      command: scroll_right
      args: 5
  - keys: [alt+i]
    binding:
      command: scroll_up
      args: 5
  - keys: [alt+k]
    binding:
      command: scroll_down
      args: 5
  - keys: [backspace]
    binding:
      command: delete
  - keys: [alt+s]
    binding:
      command: toggle_status_bar
  - keys: [alt+g]
    binding:
      command: toggle_gutter
  - keys: [alt+t]
    binding:
      command: toggle_tabs
  - keys: [alt+j]
    binding:
      command: prev_tab
  - keys: [alt+l]
    binding:
      command: next_tab

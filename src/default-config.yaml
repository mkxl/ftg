color_scheme:
    main:
        fg: "#B7B9BC"
        bg: "#1A1D23"
    status_bar:
        fg: "#2A2A2A"
        bg: "#505050"

theme:
    gutter_lighten: 0.25
    gutter_padding: 3

key_map:
    - keys: [ctrl+q]
      command:
        command: quit
    - keys: [left]
      command:
        command: move_backward
    - keys: [right]
      command:
        command: move_forward
    - keys: [up]
      command:
        command: move_up
    - keys: [down]
      command:
        command: move_down
    - keys: [backspace]
      command:
        command: delete
    - keys: [alt+s]
      command:
        command: toggle_status_bar
    - keys: [alt+g]
      command:
        command: toggle_gutter
    # - keys: ["up"]
    #   command: scroll_up
    # - keys: ["down"]
    #   command: scroll_down
    # - keys: ["ctrl+shift+s"]
    #   command: toggle_tab_sidebar

color_scheme:
  main:
    fg: "#B7B9BC"
    bg: "#1A1D23"
  status_bar:
    fg: "#2A2A2A"
    bg: "#505050"
  side_tab:
    fg: "#B7B9BC"
    bg: "#22262E"
  side_tab_path:
    fg: "#666A73"
    bg: "#22262E"

theme:
  gutter_lighten: 0.25
  gutter_padding: 3
  side_tab_percentage: 25

key_map:
  - keys: [ctrl+q]
    binding:
      command: quit
  - keys: [left]
    binding:
      command: move_backward
  - keys: [right]
    binding:
      command: move_forward
  - keys: [up]
    binding:
      command: move_up
  - keys: [down]
    binding:
      command: move_down
  - keys: [alt+j]
    binding:
      command: cycle_tab_prev
  - keys: [alt+l]
    binding:
      command: cycle_tab_next
  - keys: [alt+i]
    binding:
      command: scroll_up
      args: 5
  - keys: [alt+k]
    binding:
      command: scroll_down
      args: 5
  - keys: [backspace]
    binding:
      command: delete
  - keys: [alt+s]
    binding:
      command: toggle_status_bar
  - keys: [alt+g]
    binding:
      command: toggle_gutter
  - keys: [alt+t]
    binding:
      command: toggle_side_tab
  - keys: [alt+left]
    binding:
      command: cycle_tab_prev
  - keys: [alt+right]
    binding:
      command: cycle_tab_next

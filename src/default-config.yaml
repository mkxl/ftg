color_scheme:
    main:
        fg: "#B7B9BC"
        bg: "#1A1D23"

theme:
    buffer_border_lighten: 0.10
    buffer_title_lighten: 0.40

key_map:
    - keys: [ctrl+c]
      command:
        command: quit
    - keys: [left]
      command:
        command: move_backward
    - keys: [right]
      command:
        command: move_forward
    # - keys: ["up"]
    #   command: scroll_up
    # - keys: ["down"]
    #   command: scroll_down
    # - keys: ["ctrl+shift+s"]
    #   command: toggle_tab_sidebar
